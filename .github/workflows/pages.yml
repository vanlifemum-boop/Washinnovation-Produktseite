name: Website auf GitHub Pages veröffentlichen

# Baut die Astro-Seite und veröffentlicht sie. Läuft auf dem Standard-Branch und
# auf dem Arbeitsbranch, damit das Ergebnis schon vor dem Merge sichtbar ist.
# `configure-pages` mit enablement:true schaltet Pages beim ersten Lauf selbst ein.

on:
  push:
    branches:
      - main
      - claude/washinnovation-website-plan-fgetso
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen-und-veroeffentlichen:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Seite bauen
        run: npm run build

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
